# Reference environment configuration for Cloud Run.
# Do NOT put the API key here. The API key is read from Secret Manager by the server.
NODE_ENV: production
GOOGLE_CLOUD_PROJECT: YOUR_PROJECT_ID
GOOGLE_CLOUD_LOCATION: global
GEMINI_API_KEY_SECRET_ID: gemini-api-key
GEMINI_API_KEY_SECRET_VERSION: latest
GEMINI_MODEL: gemini-3.7-flash
GEMINI_THINKING_LEVEL: MEDIUM
CORS_ORIGINS: https://YOUR-CLIENT-DOMAIN
